[project]
name = "verdict-analyst-backend"
version = "0.1.0"
description = "VERDICT ANALYST — Causal Analytics Agent (backend): ANALYST agent × VERDICT causal engines"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.141.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.12.*",
    "pydantic-settings==2.6.*",
    "google-genai==0.8.*",
    "duckdb==1.1.*",
    "docker==7.1.*",
    "matplotlib==3.9.*",
    "pandas==2.2.*",
    "scipy==1.14.*",
    "python-dotenv==1.0.*",
    "httpx==0.27.*",
    "sqlalchemy==2.0.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
